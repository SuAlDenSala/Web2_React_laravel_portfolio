<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadowLight" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="860" fill="#f1f5f9"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(40, 30)" filter="url(#shadowLight)">
    <!-- Window Frame -->
    <rect width="1120" height="800" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="1120" height="44" rx="14" fill="#f8fafc"/>
    <rect y="30" width="1120" height="14" fill="#f8fafc"/>
    <line x1="0" y1="44" x2="1120" y2="44" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="240" y="9" width="640" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="560" y="26" fill="#475569" font-size="12" class="font-mono" text-anchor="middle">http://localhost:3000 — Light Theme &amp; Interactive Inbox</text>
    <circle cx="254" cy="22" r="3.5" fill="#22c55e"/>

    <!-- Application Body -->
    <g transform="translate(0, 44)">
      <!-- App Header / Nav -->
      <rect width="1120" height="60" fill="#ffffff" opacity="0.95"/>
      <line x1="0" y1="60" x2="1120" y2="60" stroke="#e2e8f0" stroke-width="1"/>

      <!-- Logo -->
      <rect x="40" y="16" width="28" height="28" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
      <text x="54" y="35" fill="#0f172a" font-size="13" font-weight="bold" class="font-mono" text-anchor="middle">D</text>
      <text x="78" y="35" fill="#0f172a" font-size="15" font-weight="800" class="font-sans" letter-spacing="1">DENS</text>

      <!-- Nav Links -->
      <text x="440" y="35" fill="#64748b" font-size="13" class="font-sans">About</text>
      <text x="510" y="35" fill="#64748b" font-size="13" class="font-sans">Projects</text>
      <text x="590" y="35" fill="#64748b" font-size="13" class="font-sans">Skills</text>
      <text x="655" y="35" fill="#0f172a" font-size="13" font-weight="600" class="font-sans">Contact</text>

      <!-- Right Header Actions -->
      <rect x="910" y="16" width="80" height="28" rx="5" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="950" y="34" fill="#1e293b" font-size="11" class="font-mono" text-anchor="middle">🌙 Dark</text>

      <rect x="1000" y="16" width="85" height="28" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="1042" y="34" fill="#0f172a" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Contact Me</text>

      <!-- Section Title -->
      <g transform="translate(40, 80)">
        <text x="0" y="16" fill="#64748b" font-size="11" font-weight="bold" class="font-mono">// CONTACT &amp; LOCAL STORAGE INBOX</text>
        <text x="0" y="44" fill="#0f172a" font-size="26" font-weight="800" class="font-sans">Live Message Handling System</text>
        <text x="0" y="68" fill="#64748b" font-size="13" class="font-sans">Client-side persistence demonstration with instantaneous state updates and local storage sync.</text>
      </g>

      <!-- Main Layout: Left Sidebar + Right Inbox Viewer -->
      <g transform="translate(40, 175)">
        <!-- Left Panel: Contact info & controls -->
        <g transform="translate(0, 0)">
          <rect width="360" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
          
          <text x="24" y="36" fill="#0f172a" font-size="16" font-weight="700" class="font-sans">Direct Contact</text>
          
          <!-- Email Box with Copied State -->
          <rect x="24" y="55" width="312" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="40" y="78" fill="#94a3b8" font-size="10" class="font-mono">EMAIL</text>
          <text x="40" y="98" fill="#0f172a" font-size="13" font-weight="600" class="font-mono">dens@gmail.com</text>
          
          <!-- Copied badge button -->
          <rect x="238" y="72" width="86" height="26" rx="4" fill="#10b981"/>
          <text x="281" y="89" fill="#ffffff" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Copied! ✓</text>

          <!-- Links -->
          <rect x="24" y="130" width="312" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="180" y="153" fill="#334155" font-size="12" class="font-mono" text-anchor="middle">GitHub Profile →</text>

          <!-- Divider -->
          <line x1="24" y1="185" x2="336" y2="185" stroke="#e2e8f0"/>

          <!-- Inbox Toggle active -->
          <rect x="24" y="205" width="312" height="44" rx="6" fill="#0f172a"/>
          <text x="160" y="232" fill="#ffffff" font-size="12" font-weight="600" class="font-sans" text-anchor="middle">✉ Viewing Active Inbox</text>
          <rect x="290" y="217" width="28" height="20" rx="4" fill="#ffffff"/>
          <text x="304" y="231" fill="#0f172a" font-size="11" font-weight="bold" class="font-mono" text-anchor="middle">2</text>

          <!-- System note -->
          <g transform="translate(24, 280)">
            <rect width="312" height="190" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
            <text x="16" y="26" fill="#1e40af" font-size="12" font-weight="bold" class="font-sans">💡 How It Works</text>
            <text x="16" y="50" fill="#1e3a8a" font-size="11" class="font-sans">• Contact inputs are validated instantly</text>
            <text x="16" y="70" fill="#1e3a8a" font-size="11" class="font-sans">• Submissions append to React state array</text>
            <text x="16" y="90" fill="#1e3a8a" font-size="11" class="font-sans">• Automatically serialized to JSON in</text>
            <text x="24" y="108" fill="#1d4ed8" font-size="10.5" font-weight="bold" class="font-mono">localStorage.getItem('dens_messages')</text>
            <text x="16" y="132" fill="#1e3a8a" font-size="11" class="font-sans">• Persists across reloads &amp; page visits</text>
            <text x="16" y="152" fill="#1e3a8a" font-size="11" class="font-sans">• Zero external mail-server dependencies</text>
          </g>
        </g>

        <!-- Right Panel: Inbox Viewer (Expanded) -->
        <g transform="translate(390, 0)">
          <rect width="650" height="520" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
          
          <!-- Inbox Header -->
          <g transform="translate(24, 20)">
            <text x="0" y="18" fill="#0f172a" font-size="15" font-weight="800" class="font-mono">INBOX (2 MESSAGES)</text>
            <text x="560" y="18" fill="#ef4444" font-size="11" font-weight="600" class="font-mono" text-anchor="end" text-decoration="underline">Clear All</text>
            <line x1="0" y1="32" x2="602" y2="32" stroke="#e2e8f0"/>
          </g>

          <!-- Message Card 1 -->
          <g transform="translate(24, 75)">
            <rect width="602" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
            <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="700" class="font-sans">Alex Johnson</text>
            <text x="586" y="26" fill="#94a3b8" font-size="10" class="font-mono" text-anchor="end">Nov 6, 2026, 08:45 PM</text>
            
            <text x="16" y="44" fill="#64748b" font-size="11" class="font-mono">alex.dev@gmail.com</text>
            <line x1="16" y1="56" x2="586" y2="56" stroke="#f1f5f9"/>

            <text x="16" y="74" fill="#0f172a" font-size="12" font-weight="600" class="font-sans">Subject: Collaboration on Laravel Inertia Module</text>
            <text x="16" y="98" fill="#334155" font-size="11.5" class="font-sans">Hello Dens, I saw your full-stack project repository. We are currently looking for a</text>
            <text x="16" y="116" fill="#334155" font-size="11.5" class="font-sans">developer with strong React 19 + Laravel expertise to build an internal dashboard.</text>
          </g>

          <!-- Message Card 2 -->
          <g transform="translate(24, 240)">
            <rect width="602" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
            <text x="16" y="26" fill="#0f172a" font-size="13" font-weight="700" class="font-sans">Maria Santos</text>
            <text x="586" y="26" fill="#94a3b8" font-size="10" class="font-mono" text-anchor="end">Nov 6, 2026, 09:12 PM</text>
            
            <text x="16" y="44" fill="#64748b" font-size="11" class="font-mono">msantos@technologies.ph</text>
            <line x1="16" y1="56" x2="586" y2="56" stroke="#f1f5f9"/>

            <text x="16" y="74" fill="#0f172a" font-size="12" font-weight="600" class="font-sans">Subject: TriviaForge Leaderboard Query</text>
            <text x="16" y="98" fill="#334155" font-size="11.5" class="font-sans">Great work on the quiz engine! How do you handle dynamic question filters</text>
            <text x="16" y="116" fill="#334155" font-size="11.5" class="font-sans">when scaling across categories? Would love to connect and discuss.</text>
          </g>

          <!-- Back to Form Button -->
          <g transform="translate(24, 435)">
            <rect width="602" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
            <text x="301" y="26" fill="#0f172a" font-size="12" font-weight="600" class="font-sans" text-anchor="middle">← Back to Contact Form</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
